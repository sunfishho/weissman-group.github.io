<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light">
  <title>Courtade–Kumar</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' fill='white'/%3E%3Cpath d='M9 9v22m22-22v22M9 20h22' stroke='%23202020' stroke-width='4'/%3E%3Ccircle cx='20' cy='20' r='4' fill='%23ad412e'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header"><a class="wordmark" href="./"><svg class="brand-mark" viewBox="0 0 96 68" fill="none" aria-hidden="true"><rect x="9" width="12" height="10" fill="#963323"/><rect x="51" width="39" height="10" fill="#a71cba"/><rect y="22" width="51" height="11" fill="#83a6ee"/><rect x="61" y="22" width="27" height="11" fill="#f3ed78"/><rect x="18" y="34" width="38" height="11" fill="#34349b"/><rect x="52" y="45" width="44" height="11" fill="#819b42"/><rect x="29" y="57" width="11" height="11" fill="#2b2a69"/><rect x="63" y="57" width="25" height="11" fill="#295b34"/></svg><span class="brand-name">COURTADE<span class="brand-dash">–</span>KUMAR</span></a></header>
  <main class="unlock-shell">
    <h1>A Bit,<br> Too Many Proofs?</h1>
    <p class="subtitle">Our journey through the Courtade-Kumar conjecture</p>
    <p class="intro">Enter the shared password to read the blog and visual proof.</p>
    <form id="unlock-form" class="unlock-form">
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" required spellcheck="false" autocapitalize="none">
      <button type="submit">Open →</button>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </form>
    <noscript><p>JavaScript is needed to open this encrypted draft.</p></noscript>
  </main>
  <footer class="site-footer"><div class="footer-inner"><div class="footer-wordmark"><svg class="brand-mark" viewBox="0 0 96 68" fill="none" aria-hidden="true"><rect x="9" width="12" height="10" fill="#963323"/><rect x="51" width="39" height="10" fill="#a71cba"/><rect y="22" width="51" height="11" fill="#83a6ee"/><rect x="61" y="22" width="27" height="11" fill="#f3ed78"/><rect x="18" y="34" width="38" height="11" fill="#34349b"/><rect x="52" y="45" width="44" height="11" fill="#819b42"/><rect x="29" y="57" width="11" height="11" fill="#2b2a69"/><rect x="63" y="57" width="25" height="11" fill="#295b34"/></svg><span class="brand-name">COURTADE<span class="brand-dash">–</span>KUMAR</span></div></div></footer>
  <script>
(() => {
 'use strict';
 const form=document.getElementById('unlock-form'),field=document.getElementById('password'),status=document.getElementById('status'),button=form.querySelector('button');
 const bytes=value=>Uint8Array.from(atob(value),c=>c.charCodeAt(0));
 const encode=value=>btoa(String.fromCharCode(...value));
 const storageKey='ck-reader-key-v2';
 async function unlock(secret,remembered){
  button.disabled=true;status.textContent='Opening…';
  try{
   const response=await fetch('article.enc',{cache:'no-store'});
   if(!response.ok)throw Error('download');
   const payload=await response.json();
   if(payload.version!==2||payload.algorithm!=='AES-GCM'||payload.kdf!=='PBKDF2'||payload.hash!=='SHA-256'||payload.iterations!==310000)throw Error('format');
   let raw;
   if(remembered){if(remembered.salt!==payload.salt)throw Error('expired');raw=bytes(remembered.key);}
   else{const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(secret),'PBKDF2',false,['deriveBits']);secret='';raw=new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt:bytes(payload.salt),iterations:payload.iterations,hash:'SHA-256'},material,256));}
   const key=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);
   const pages=JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(payload.iv)},key,bytes(payload.data))));
   const name=location.pathname.split('/').pop()||'index.html';
   if(!Object.hasOwn(pages,name))throw Error('page');
   try{sessionStorage.setItem(storageKey,JSON.stringify({salt:payload.salt,key:encode(raw)}));}catch{}
   document.open();document.write(pages[name]);document.close();
  }catch{try{sessionStorage.removeItem(storageKey);}catch{}status.textContent=remembered?'Enter the password to open this version.':'That password did not open the site. Please try again.';button.disabled=false;field.focus();}
 }
 form.addEventListener('submit',event=>{event.preventDefault();if(button.disabled)return;const secret=field.value;field.value='';unlock(secret,null);});
 try{const remembered=JSON.parse(sessionStorage.getItem(storageKey)||'null');if(remembered)unlock('',remembered);}catch{}
})();
</script>
</body>
</html>
